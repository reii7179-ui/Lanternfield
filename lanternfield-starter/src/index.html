<!DOCTYPE html>
<!-- Built by build.js from the files in src/. Do not edit this file by hand: edit src/, then run npm run build. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Keep Lanternfield Lit</title>
<!-- @fonts -->
<style>
<!-- @css -->
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="map" role="img" aria-label="Live park map. Every ride is also listed on the park board below."></canvas>
  <header class="top" id="top">
    <div class="brand">Lanternfield</div>
    <div class="when"><div><small id="h-day">Day 1 of 14</small><b id="h-dow">Monday</b></div><div class="clock" id="h-clock">09:00</div></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-a="pause" id="b-pause" aria-pressed="false">Pause</button>
      <button type="button" data-a="speed" data-v="0.5" id="b-sh" aria-pressed="false" aria-label="Half speed">½×</button>
      <button type="button" data-a="speed" data-v="1" id="b-s1" aria-pressed="false">1×</button>
      <button type="button" data-a="speed" data-v="2" id="b-s2" aria-pressed="false">2×</button>
    </div>
    <nav class="menu" aria-label="Company">
      <button type="button" class="mini keep seatb" data-a="seats" id="b-seat" aria-label="Change seat">Seat</button>
      <button type="button" class="mini" data-a="desk" data-v="company">Company</button>
      <button type="button" class="mini" data-a="desk" data-v="team">Team</button>
      <button type="button" class="mini" data-a="desk" data-v="stores">Stores</button>
      <button type="button" class="mini only-sm" data-a="park">Menu</button>
      <button type="button" class="mini sq keep" data-a="help" aria-label="How to play">?</button>
    </nav>
    <div class="res" aria-label="Company figures">
      <div class="stat"><small>Cash</small><b id="h-cash" class="num">$0</b></div>
      <div class="stat"><small>Uptime</small><b id="h-up" class="num">100%</b></div>
      <div class="stat"><small>Board</small><b id="h-conf" class="num">60</b></div>
      <div class="stat"><small>Streak</small><b id="h-streak" class="num">×0</b></div>
      <div class="stat"><small>Glow</small><b id="h-glow" class="num">80</b><div class="glowbar"><span id="h-glowbar"></span></div></div>
      <div class="stat"><small>Lanterns</small><b id="h-lit" class="num">0</b></div>
    </div>
  </header>
  <aside class="obj hp" id="obj" aria-label="Objectives and today's events"></aside>
  <div class="coach" id="coach" role="status" aria-live="polite"></div>
  <aside class="rail" id="rail" aria-label="Your people"></aside>
  <div class="ticker" id="ticker" aria-live="polite"></div>
  <div class="armed" id="armed" hidden></div>
  <div class="task" id="task" aria-live="polite"></div>
  <div class="log" id="log" aria-label="Radio log"></div>
  <footer class="dock" id="dock">
    <div class="mm">
      <canvas id="mini" role="img" aria-label="Minimap. Tap to move the view."></canvas>
      <div class="mmz">
        <button type="button" class="mini sq" data-a="zoom" data-v="1.3" aria-label="Zoom in">+</button>
        <button type="button" class="mini sq" data-a="zoom" data-v="0.77" aria-label="Zoom out">−</button>
        <button type="button" class="mini sq" data-a="fit" aria-label="Show the whole park">⤢</button>
      </div>
    </div>
    <section class="board" aria-label="Park board"><h2 class="cap" id="boardcap"></h2><div class="tilesg" id="board"></div></section>
    <section class="selp" id="selp" aria-label="Selection and commands"></section>
  </footer>
</div>
<div id="modal"></div>

<!-- @engine -->
</script>

</body>
</html>
