<style>
/* ---------- the "Lantern Glow" look: glass panels over the night park, lantern-gold accents that glow,
   and chunky, raised buttons with a hard bottom edge.
   Speed: panels that sit over the moving map use hard edges, not soft blurred shadows. A soft shadow over the map
   measurably slowed the phone budget (tests/browser/perf.js); hard edges cost next to nothing. ---------- */
:root{--night:#080c24;--panel:#0f1536;--raise:#222a62;--line:#2f3a7c;--edge:#060820}
body{background:#060a1e}
.top{background:linear-gradient(180deg,rgba(9,13,38,.96),rgba(9,13,38,.88));border-bottom:1px solid rgba(160,180,255,.16);box-shadow:0 3px 0 rgba(3,5,18,.6)}
.brand{text-shadow:0 0 16px rgba(255,179,71,.6),0 0 2px rgba(255,179,71,.8)}
.when .clock{text-shadow:0 0 14px rgba(247,237,216,.25)}
.stat{background:linear-gradient(180deg,rgba(30,38,88,.75),rgba(10,14,40,.75));border-color:rgba(160,180,255,.14);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.glowbar span{box-shadow:0 0 8px var(--lantern)}
.hp{background:linear-gradient(180deg,rgba(24,31,76,.86),rgba(9,13,38,.86));border-color:rgba(160,180,255,.14);border-radius:14px;box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.06)}
.oitem{background:rgba(255,255,255,.05);border-radius:8px}
.dock{background:linear-gradient(0deg,rgba(6,9,28,.98),rgba(9,13,38,.94));border-top:1px solid rgba(160,180,255,.16);box-shadow:0 -3px 0 rgba(3,5,18,.6)}
.selp{background:rgba(6,9,28,.75);border-color:rgba(160,180,255,.14);border-radius:14px}
.ticker{background:rgba(9,13,38,.94);border-radius:12px;box-shadow:0 3px 0 var(--edge)}

/* chunky buttons: solid, rounded, a hard edge underneath; they sink when pressed */
.mini,.cmd{border:0;border-radius:12px;background:linear-gradient(180deg,#2c3676,#222a62);box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.08)}
.mini:hover,.cmd:hover{background:linear-gradient(180deg,#36428c,#2a3374)}
.mini:active,.cmd:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.08)}
.cmd[disabled],.cmd[disabled]:active{transform:none;box-shadow:0 3px 0 var(--edge)}
.cmd.go{background:linear-gradient(180deg,#ffc56b,#ffa634);box-shadow:0 3px 0 #a5600f,inset 0 1px 0 rgba(255,255,255,.45)}
.cmd.go:active{box-shadow:0 1px 0 #a5600f,inset 0 1px 0 rgba(255,255,255,.45)}
.cmd[aria-pressed="true"]{box-shadow:0 3px 0 var(--edge),inset 0 0 0 2px var(--lantern)}
.speed{border:0;border-radius:14px;background:#060920;box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.speed button{border-radius:10px}
.speed button[aria-pressed="true"]{box-shadow:0 3px 0 #a5600f}
/* board tiles keep a solid background so the alarm flash (which animates the background colour) still shows */
.as{border:0;border-left:5px solid var(--c);border-radius:10px;background:#222a62;box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.06)}
.as:hover{border-color:var(--c);background:#2a3374}
.as.on{border-left-color:var(--c);box-shadow:0 3px 0 var(--edge),0 0 0 2px var(--ink)}
/* crew cards keep their 2px border: a crew member calling for you flashes it red */
.unit{border:2px solid rgba(160,180,255,.18);border-radius:14px;background:rgba(15,20,54,.92);box-shadow:0 3px 0 var(--edge)}
.unit.on{box-shadow:0 3px 0 var(--edge),0 0 0 3px var(--sky)}
#mini{border-radius:12px}
/* ---------- interface motion: quick, small, and never in the way ----------
   New cards slide in once, timers and bars slide to their new length, panels and dialogs fade instead of snapping.
   Panels are patched in place (setHTML), so an element that stays keeps its animation state.
   Reduced motion (html.calm, or the device setting) switches every animation and transition here off. */
@keyframes lf-slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes lf-drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes lf-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lf-fade{from{opacity:0}to{opacity:1}}
@keyframes lf-pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes lf-fadeout{to{opacity:0}}
@keyframes lf-popout{to{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes lf-fast{0%,100%{box-shadow:0 0 0 0 rgba(121,194,255,0),0 3px 0 var(--edge)}50%{box-shadow:0 0 0 3px rgba(121,194,255,.55),0 3px 0 var(--edge)}}
@keyframes lf-bolt{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* new alerts and inbox cards slide in from the left, the side they live on */
.alert,.req{animation:lf-slide .26s cubic-bezier(.2,.8,.3,1) both}
.alert.a-rescue{animation:lf-slide .26s cubic-bezier(.2,.8,.3,1) both,alarm .5s .26s ease-in-out infinite alternate}
/* a fault still inside its fast-response window: the card breathes blue, faster as the window closes, and the bolt beats */
.alert.fast{animation:lf-slide .26s cubic-bezier(.2,.8,.3,1) both,lf-fast var(--beat,1s) .26s ease-in-out infinite}
.alert .bolt{display:inline-block;animation:lf-bolt var(--beat,1s) ease-in-out infinite}
/* new radio lines rise into the log; the objectives drop open; a new subject in the selection panel fades in */
.radio>div{animation:lf-rise .22s ease-out both}
.obody{animation:lf-drop .18s ease-out both}
.selw{animation:lf-fade .16s ease-out both}
.coach>*{animation:lf-rise .22s ease-out both}
.tabbody{display:flex;flex-direction:column;gap:inherit;animation:lf-fade .16s ease-out both}
/* dialogs: the backdrop fades and the dialog lifts in; closing reverses it quickly */
.scrim{animation:lf-fade .18s ease-out both}
.scrim>.dialog{animation:lf-pop .22s cubic-bezier(.2,.8,.3,1) both}
#modal.leaving .scrim{animation:lf-fadeout .16s ease-in both;pointer-events:none}
#modal.leaving .dialog{animation:lf-popout .16s ease-in both}
/* timers drain and bars fill smoothly instead of jumping a step every park minute. Only the few that matter: a bar
   whose width animates is laid out again every frame, and the 14 board tiles and the crew's energy bars would cost too much. */
.alert i,.req>i,.glowbar span,#selp .bar span{transition:width .45s linear,background-color .3s}
/* state changes on tiles, cards and buttons fade rather than snap */
.as,.unit,.cmd,.mini,.speed button,.alert,.req,.stat b{transition:background-color .2s,border-color .2s,color .25s,box-shadow .2s,opacity .2s}
.cmd:active,.mini:active{transition-duration:.05s}
.stat b{display:inline-block} /* so the streak can pop */

/* ---------- feedback (phase 4): a breakdown is felt, streaks build, the night and the season get their moment ---------- */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the streak: six pips up to the bonus cap, warmer as it builds */
.spips{display:flex;gap:2px;margin-top:2px}
.spips i{flex:1;height:3px;border-radius:2px;background:var(--raise);transition:background-color .25s}
.spips i.on{background:var(--lantern)}
.stat.heat1 b{color:#ffd27a}
.stat.heat2 b{color:#ffb347;text-shadow:0 0 8px rgba(255,179,71,.55)}
.stat.heat3 b{color:#ff9a5a;text-shadow:0 0 12px rgba(255,140,60,.8)}
.stat.heat3 .spips i.on{background:#ff8f3d}
.stat.heat3{border-color:rgba(255,143,61,.6)}
/* numbers counted by CSS: a registered whole-number property runs from 0 to --to; the number itself is in .sr for screen readers */
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
@keyframes lf-count{from{--n:0}to{--n:var(--to)}}
.cnt{--n:var(--to);counter-reset:lfn var(--n);animation:lf-count var(--dur,1s) var(--ease,linear) var(--delay,0s) both}
.cnt::before{content:counter(lfn)}
/* the night's report: each lantern that went up lights in turn, in time with the count, then the headline */
@keyframes lf-light{0%{filter:grayscale(1) brightness(.45);transform:translateY(5px)}55%{filter:brightness(1.6) drop-shadow(0 0 8px #ffb347);transform:translateY(-4px)}100%{filter:none;transform:none}}
.lant.lit{animation:lf-light .55s cubic-bezier(.2,.8,.3,1) calc(300ms + var(--i,0) * 140ms) both}
.rephead{animation:lf-rise .4s ease-out var(--delay,0s) both}
@keyframes lf-glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 10px #ffd27a) brightness(1.25)}}
.lrow.all .lant.lit svg{animation:lf-glow .9s ease-in-out calc(500ms + var(--n,12) * 140ms) 2}
/* the season: the grade stamps down, the score counts up, the bars fill one after another */
@keyframes lf-stamp{0%{opacity:0;transform:scale(2.6) rotate(-10deg)}65%{opacity:1;transform:scale(.9) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes lf-fill{from{transform:scaleX(0)}to{transform:none}}
.final .grade{animation:lf-stamp .5s cubic-bezier(.2,.8,.3,1) .25s both;text-shadow:0 0 30px rgba(255,179,71,.45)}
.final .kpi .bar span{transform-origin:left;animation:lf-fill .7s cubic-bezier(.2,.8,.3,1) calc(.6s + var(--k,0) * 110ms) both}
.scrim.final{background:linear-gradient(rgba(7,9,26,.12),rgba(7,9,26,.85) 45%)}

/* ---------- sound settings (phase 5) ---------- */
.vols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px;margin-top:8px}
.vol{display:grid;grid-template-columns:minmax(0,1fr) 34px;grid-template-areas:"name val" "range range";align-items:center;gap:2px 8px;font-size:13px}
.vol>span{grid-area:name}.vol small{display:block;color:var(--dim);font-size:11.5px}
.vol output{grid-area:val;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.vol input{grid-area:range;width:100%;accent-color:var(--lantern);min-height:28px}
.vol input:disabled{opacity:.45}

/* the playtest note on the title screen (playtest builds only) */
.ptnote{max-width:62ch;border:1px solid var(--lantern);border-left-width:4px;border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--lantern) 10%,transparent);font-size:14px}

/* countersign items and the big decisions at the desk (step 2 of the active seats) */
.kind.k-cs{color:var(--lantern);border-color:var(--lantern)}
.bigs{gap:8px}
.bigd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 12px}
.bigd.mine{border-left-color:var(--lantern)}
.bigd>div:first-child{display:flex;flex-direction:column;gap:2px;flex:1 1 260px;min-width:0}
.bigd small{font-size:13px}
.bigd .btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
:root{
  /* Layout: the park is the board. Map in the middle, work orders left, the selected ride right, the team along the bottom, clock and accounts on top. The planning desk (team, stores, projects) opens over it. One world, one theme: a funfair going from afternoon into lantern-lit night. */
  --night:#0e1330;
  --panel:#161c40;
  --raise:#212957;
  --line:#353e75;
  --ink:#f7edd8;
  --dim:#aaa6c6;
  --lantern:#ffb347;
  --ember:#ff5d4a;
  --jade:#5fd6a8;
  --sky:#79c2ff;
  --mech:#f08a5d; --elec:#f4d35e; --ctrl:#66d1c4; --mach:#c9a6ff; --store:#9db7ff; --sup:#f7edd8; --eng:#ff9ecb; --mat:#8fd3ff; --hr:#b6e388;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overscroll-behavior:none;background:var(--night);color:var(--ink);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

/* ---------- RTS layout: the map fills the screen and the HUD sits on top of it.
   Top: clock, speed, resources. Top-left: objectives. Right edge: unit rail. Bottom dock: minimap, park board, selection and command card. ---------- */
.app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;--th:52px;--dh:204px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
.hp{background:color-mix(in srgb,var(--night) 86%,transparent);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:6px 14px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:var(--panel);border-bottom:2px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.brand{font:400 21px/1 var(--display);letter-spacing:.01em;color:var(--lantern)}
.when{display:flex;align-items:center;gap:9px}
.when .clock{font:400 28px/1 var(--display);font-variant-numeric:tabular-nums;min-width:78px}
.when small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;white-space:nowrap}
.when b{font-size:13.5px;display:block;line-height:1.1}
.speed{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--night);border:1px solid var(--line)}
.speed button{border:0;background:none;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:var(--dim);min-width:36px;min-height:30px}
.speed button:hover{color:var(--ink);background:var(--raise)}
.speed button[aria-pressed="true"]{background:var(--lantern);color:#2a1700}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid color-mix(in srgb,var(--c,var(--dim)) 55%,transparent);color:var(--c,var(--dim));background:color-mix(in srgb,var(--c,var(--dim)) 12%,transparent);white-space:nowrap}
.menu{display:flex;gap:5px}
.menu .only-sm{display:none}
.mini{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;min-height:32px;white-space:nowrap}
.mini:hover{border-color:var(--dim)}
.mini.sq{width:32px;padding:0;font-size:16px;line-height:1}
.res{display:flex;gap:6px;margin-left:auto;align-items:stretch}
.stat{line-height:1.1;min-width:60px;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:3px 9px;flex:none}
.stat small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.stat b{font:400 18px/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.neg{color:var(--ember)}
.glowbar{height:3px;border-radius:2px;background:var(--raise);overflow:hidden;width:100%}
.glowbar span{display:block;height:100%;background:var(--lantern)}

.obj{position:absolute;left:8px;top:calc(var(--th) + 8px);z-index:2;width:236px;max-width:calc(100% - 80px);left:max(8px,env(safe-area-inset-left))}
.ohead em{font-style:normal;color:var(--dim);margin-left:auto;margin-right:8px;letter-spacing:.06em}
.ohead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:7px 10px;font:700 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lantern)}
.obody{display:flex;flex-direction:column;gap:5px;padding:0 8px 8px}
.oitem{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;font-size:12.5px;line-height:1.25;background:color-mix(in srgb,var(--raise) 70%,transparent);border-radius:6px;padding:5px 7px;align-items:baseline}
.oitem.main{grid-template-columns:16px minmax(0,1fr);border-left:3px solid var(--lantern)}
.oitem i{font-style:normal;color:var(--lantern)}
.oitem time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--lantern)}

.alerts{display:flex;flex-direction:column;gap:4px;padding:0 8px 8px}
.alert{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;border:1px solid var(--c);border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--night));border-radius:6px;padding:6px 8px 7px;font-size:12.5px;line-height:1.2;text-align:left;overflow:hidden;min-height:36px}
.alert b{font-weight:700}
.alert span{white-space:nowrap;font-weight:700;color:var(--c)}
.alert i{position:absolute;left:0;bottom:0;height:3px;background:var(--c)}
.a-rescue{--c:var(--ember);animation:alarm .5s ease-in-out infinite alternate}
.a-esc{--c:var(--lantern)} .a-open{--c:var(--mech)} .a-wave{--c:var(--sky)}
.cmd{position:relative}
.cmd kbd{position:absolute;right:5px;top:5px;font:700 10px/1.3 var(--body);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6}
@media (pointer:fine){.cmd:has(kbd) b{padding-right:20px}}
.obj{max-height:calc(100% - var(--th) - var(--dh) - 56px);overflow:auto}
@media (pointer:coarse){.cmd kbd{display:none}}
.rail{position:absolute;right:6px;right:max(6px,env(safe-area-inset-right));top:calc(var(--th) + 8px);bottom:calc(var(--dh) + 8px);z-index:2;display:flex;flex-direction:column;flex-wrap:wrap-reverse;gap:5px;align-content:flex-start;pointer-events:none}
.unit{pointer-events:auto;position:relative;width:52px;height:54px;border:2px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--night) 82%,transparent);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;flex:none}
.unit .ul{width:26px;height:26px;border-radius:50%;background:var(--c);color:#16122b;font-weight:700;font-size:14px;display:grid;place-items:center}
.unit .un{font-size:10px;line-height:1;color:var(--ink);max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit kbd{position:absolute;left:2px;top:1px;font:700 10px var(--body);color:var(--dim)}
.unit .us{position:absolute;left:0;right:0;bottom:0;height:4px}
.unit .ue{position:absolute;right:3px;top:7px;bottom:8px;width:4px;border-radius:2px;background:rgba(247,237,216,.14);overflow:hidden}
.unit .ue i{position:absolute;left:0;right:0;bottom:0;border-radius:2px}
.unit.coachme,.as.coachme{animation:coachme .7s ease-in-out infinite alternate}
@keyframes coachme{from{box-shadow:0 0 0 2px var(--lantern)}to{box-shadow:0 0 0 6px color-mix(in srgb,var(--lantern) 35%,transparent)}}
.as.rush{box-shadow:inset 0 0 0 2px var(--lantern)}
.coach{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--dh) + 12px);z-index:4;width:min(470px,calc(100% - 24px));background:color-mix(in srgb,var(--panel) 97%,transparent);border:2px solid var(--lantern);border-radius:14px;padding:11px 14px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.coach:empty{display:none}
.diffs{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--night);border:1px solid var(--line);align-self:flex-start}
.diffs button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--dim);min-height:32px}
.diffs button[aria-checked="true"]{background:var(--lantern);color:#2a1700}
.tstart{position:sticky;bottom:-20px;background:var(--panel);padding:10px 0 4px;margin-top:-4px}
.pt{width:100%;min-height:86px;background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.own{background:var(--raise);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cover div.hasgap{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ember) 70%,transparent)}
.dcoach{border:2px solid var(--lantern);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--lantern) 8%,var(--panel));display:flex;flex-direction:column;gap:6px}
.dcoach p{font-size:14px;line-height:1.38}
.cmd.coachme{animation:coachme .7s ease-in-out infinite alternate}

.coach.top{bottom:auto;top:calc(var(--th) + 8px)}
.app.coaching .ticker{display:none}
.app.coachride .obj{visibility:hidden}
.coach .ch{display:flex;align-items:center;gap:8px;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lantern)}
.coach .ch em{font-style:normal;color:var(--dim);margin-left:auto;letter-spacing:.06em}
.coach p{font-size:14.5px;line-height:1.38}
.coach .wait{font-size:12.5px;color:var(--sky);font-weight:700}
.coach .row{gap:6px}
@media (max-width:620px){.coach{bottom:calc(var(--dh) + 8px);padding:9px 11px;left:8px;right:58px;width:auto;transform:none}.coach.top{top:calc(var(--th) + 6px)}.coach p{font-size:13.5px}}
@media (max-height:520px) and (orientation:landscape){.coach{bottom:calc(var(--dh) + 4px);left:auto;right:60px;transform:none;width:min(430px,58%);padding:7px 10px;gap:4px}.coach p{font-size:12.5px;line-height:1.25}}
.unit:hover{border-color:var(--dim)}
.unit.on{border-color:var(--sky);box-shadow:0 0 0 2px color-mix(in srgb,var(--sky) 45%,transparent)}
.unit.off{opacity:.45}
.unit.call{animation:call 1s ease-in-out infinite alternate}
@keyframes call{to{border-color:var(--ember)}}

.ticker{position:absolute;left:50%;top:calc(var(--th) + 8px);transform:translateX(-50%);z-index:2;max-width:min(520px,calc(100% - 150px));background:color-mix(in srgb,var(--night) 90%,transparent);border:1px solid var(--line);border-left:4px solid var(--c,var(--dim));border-radius:8px;padding:6px 12px;font-size:13px;pointer-events:none}
.ticker:empty{display:none}
.paused{position:absolute;left:50%;top:calc(var(--th) + 46px);transform:translateX(-50%);z-index:2;background:var(--lantern);color:#2a1700;font-weight:700;font-size:12.5px;padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.armed{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--dh) + 10px);z-index:2;width:max-content;background:color-mix(in srgb,var(--night) 90%,transparent);border:1px solid var(--sky);border-radius:8px;padding:5px 10px;font-size:12.5px;pointer-events:none;max-width:calc(100% - 24px)}
.log{position:absolute;left:8px;left:max(8px,env(safe-area-inset-left));bottom:calc(var(--dh) + 8px);z-index:2;width:min(var(--lw,380px),calc(100% - 84px));display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-height:calc(100% - var(--th) - var(--dh) - 16px)}
.lbtn{pointer-events:auto;border:1px solid var(--line);background:color-mix(in srgb,var(--night) 86%,transparent);border-radius:6px;padding:3px 9px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-height:26px}
.log .radio{width:100%;background:color-mix(in srgb,var(--night) 72%,transparent);border-radius:8px;padding:6px 8px;text-shadow:0 1px 2px #000}
.app:not(.loglines) .log .radio:not(.open),.app.logshy .log .radio:not(.open){display:none}
.log .radio.open{pointer-events:auto;flex:0 1 340px;min-height:0;overflow:auto;background:color-mix(in srgb,var(--night) 92%,transparent);border:1px solid var(--line)}

.dock{position:absolute;left:0;right:0;bottom:0;z-index:3;height:204px;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,500px);gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));background:var(--panel);border-top:2px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.4)}
.dock>*{min-width:0;min-height:0}
.mm{display:flex;gap:5px}
#mini{height:100%;aspect-ratio:1000/680;border:1px solid var(--line);border-radius:8px;background:#0b1029;touch-action:none;cursor:crosshair;display:block}
.mmz{display:flex;flex-direction:column;gap:5px}
.board{display:flex;flex-direction:column;gap:6px}
.capn{font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.tilesg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));grid-auto-rows:minmax(0,1fr);gap:5px;flex:1;min-height:0;overflow:auto}
.as{position:relative;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--raise);border-radius:4px 8px 8px 4px;padding:5px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0;min-height:50px;overflow:hidden}
.as b{font-size:11px;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.as .st{font-size:11.5px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as .st em{font-style:normal;color:var(--sky)}
.as .st em.np{color:var(--mach)}
.as>b,.as>.st{flex-shrink:0}
.as:has(.bd) .st{padding-right:19px}
.as .bd{position:absolute;right:4px;bottom:11px;width:17px;height:17px;border-radius:50%;background:var(--c);color:#16122b;font:700 10.5px/17px var(--body);text-align:center;font-style:normal}
.as:hover,.as.on{border-color:var(--ink);border-left-color:var(--c)}
.as.on{background:color-mix(in srgb,var(--ink) 10%,var(--raise))}
.as.alarm{animation:alarm .8s ease-in-out infinite alternate}
@keyframes alarm{to{background:color-mix(in srgb,var(--ember) 30%,var(--raise))}}
.selp{container-type:inline-size;overflow:auto;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:8px;overscroll-behavior:contain}
.selw{display:flex;flex-direction:column;gap:6px}
.sinfo{display:contents}
.shead{order:0}.selw>.cmds{order:1}.sdet{order:2;display:flex;flex-direction:column;gap:6px}
@container (min-width:470px){
  .selw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px;height:100%}
  .sinfo{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-right:2px}
  .selw>.cmds{overflow:auto;min-height:0;align-content:start}
}
.shead{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center}
.sh b{display:block;font:400 17px/1.1 var(--display)}
.sh small{display:block;font-size:12px;color:var(--dim)}
.selp .note{font-size:12px}
.selp .kv div{padding:3px 8px}
.selp .sk{font-size:11px;color:var(--dim)}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:5px}
.cmd{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:5px 8px;text-align:left;min-height:42px;line-height:1.15;min-width:0}
.cmd b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd small{display:block;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd:hover{border-color:var(--ink)}
.cmd.go{background:var(--lantern);border-color:var(--lantern);color:#2a1700}
.cmd.go small{color:#5a3a00}
.cmd[aria-pressed="true"]{border-color:var(--lantern);background:color-mix(in srgb,var(--lantern) 16%,var(--raise))}
.cmd[disabled]{opacity:.45;cursor:not-allowed}
.cmd.dupa{display:none}
@media (min-width:621px){.cmd.dup{display:none}}

h2.cap{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.count{background:var(--ember);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;font:700 12px/20px var(--body);text-align:center}
.sect{display:flex;flex-direction:column;gap:8px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--dim);font-size:13px}

/* fault tickets: a stub with a punched edge */
.ticket{--sev:var(--lantern);display:block;width:100%;text-align:left;background:var(--raise);border:1px solid var(--line);border-left:5px solid var(--sev);border-radius:4px 10px 10px 4px;padding:8px 10px;position:relative}
.ticket.major{--sev:var(--ember)}
.ticket.svc{--sev:var(--sky)}
.ticket:hover,.ticket.on{border-color:var(--ink);border-left-color:var(--sev)}
.ticket b{display:block;font-size:14px}
.ticket span{display:block;font-size:12px;color:var(--dim)}

.seat small{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seat b{font:400 17px/1.1 var(--display);color:var(--ink)}
.seat span{font-size:12.5px;color:var(--dim);line-height:1.3}
.seat.on{border-color:var(--lantern);box-shadow:0 0 0 2px color-mix(in srgb,var(--lantern) 40%,transparent);background:color-mix(in srgb,var(--lantern) 10%,var(--raise))}
.seat.on b{color:var(--lantern)}
.seat em{position:absolute;right:8px;top:8px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--lantern);color:#2a1700;border-radius:4px;padding:1px 6px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.who button[aria-pressed="true"]{border-color:var(--lantern);background:var(--lantern);color:#2a1700}
/* the real-life role card */
.rl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.rl>div{background:var(--raise);border-radius:10px;padding:9px 11px;font-size:13px}
.rl h4{margin:0 0 4px;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lantern)}
.rl ul{margin:0;padding-left:17px}
.rl li{margin:1px 0}
.life{font-size:14.5px;max-width:70ch}
.chain{display:flex;flex-direction:column;align-items:center;gap:0}
.cn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:min(440px,100%);border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 11px;font-size:13px}
.cn b{font-size:13.5px}
.cn small{color:var(--dim);font-size:11.5px;grid-column:1/-1}
.cn.vac{border-style:dashed;background:none}
.cn.me{border-color:var(--lantern);box-shadow:0 0 0 2px color-mix(in srgb,var(--lantern) 35%,transparent)}
.cn.view{background:color-mix(in srgb,var(--sky) 12%,var(--raise))}
.cn .lim{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;white-space:nowrap}
.chain i{width:2px;height:12px;background:var(--line)}
/* the inbox: requests that need your answer, with a timer */
.inbox{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.req{--c:var(--sky);position:relative;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--night));border-radius:8px;padding:6px 8px 9px;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.req.hot{--c:var(--ember)}
.req.wo{--c:var(--lantern)}
.rqh{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.rqh span{white-space:nowrap}
.req p{font-size:12.5px;line-height:1.28}
.req .rqn{font-size:11px;color:var(--dim);line-height:1.25}
.rqo{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px}
.rqo .cmd{min-height:36px;padding:4px 7px}
.rqo .cmd b{white-space:normal;font-size:12px}
.rqo .cmd small{white-space:normal;font-size:10.5px;line-height:1.15}
.req>i{position:absolute;left:0;bottom:0;height:3px;background:var(--c)}
.sent{font-size:11.5px;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding:4px 7px;line-height:1.25}
.sent b{color:var(--ink);font-weight:700}
.sent.esc{border-style:solid;border-color:var(--ember);color:var(--ink)}
.sent.esc b{color:var(--ember)}
.more{font-size:11.5px;color:var(--dim);text-align:center}
.ohead .count{margin-right:6px}
.kmeter{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.kmeter .bar{height:7px}
.dx{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.sym{font-style:italic}
.ai{display:flex;flex-direction:column;gap:4px;margin:0;padding-left:18px;font-size:13px}
.scard{background:var(--raise);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.scard h3{font:400 18px/1.1 var(--display);color:var(--lantern)}
.krow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:13px;align-items:baseline}
.krow b{font-variant-numeric:tabular-nums}
@media (max-width:620px){ .seats{grid-template-columns:repeat(2,minmax(0,1fr))} .seat{min-height:84px;padding:8px 9px} .seat b{font-size:15px} .seat span{font-size:11.5px} .rqo{grid-template-columns:minmax(0,1fr)} }
@media (max-height:520px) and (orientation:landscape){ .req:nth-of-type(n+2){display:none} .req .rqn{display:none} .req{padding:4px 6px 7px;gap:3px} .req p{font-size:11.5px;line-height:1.2} .rqo{grid-template-columns:repeat(2,minmax(0,1fr))} .rqo .cmd{min-height:32px} .rqo .cmd small{display:none} }
@media (min-width:621px) and (max-width:900px){ .ticker{left:256px;right:72px;transform:none;max-width:none} }
/* Reduced motion: the UI sets html.calm from the in-game Motion setting (Auto follows the device).
   The media query is a fallback for before the script runs; choosing Full in game (html.fullmotion) overrides it. */
html.calm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){html:not(.fullmotion) *{animation:none!important;transition:none!important}}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.setrow b{display:block}
.setrow small{display:block;color:var(--dim);font-size:12.5px}

<body>

      <button type="button" class="mini" data-a="desk" data-v="stores">Stores</button>

      <button type="button" class="mini sq keep" data-a="help" aria-label="How to play">?</button>
    </nav>
    <div class="res" aria-label="Company figures">
      <div class="stat"><small>Cash</small><b id="h-cash" class="num">$0</b></div>
      <div class="stat"><small>Uptime</small><b id="h-up" class="num">100%</b></div>
      <div class="stat"><small>Board</small><b id="h-conf" class="num">60</b></div>
      <div class="stat" id="s-streak"><small>Streak</small><b id="h-streak" class="num">×0</b><div class="spips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>

    </div>
  </header>
  <aside class="obj hp" id="obj" aria-label="Objectives and today's events"></aside>
  <div class="coach" id="coach" role="status" aria-live="polite"></div>
  <aside class="rail" id="rail" aria-label="Your people"></aside>
  <div class="ticker" id="ticker" aria-live="polite"></div>
  <div class="armed" id="armed" hidden></div>
  <div class="task" id="task" aria-live="polite"></div>
  <div class="log" id="log" aria-label="Radio log"></div>
  <footer class="dock" id="dock">
    <div class="mm">
      <canvas id="mini" role="img" aria-label="Minimap. Tap to move the view."></canvas>
      <div class="mmz">
        <button type="button" class="mini sq" data-a="zoom" data-v="1.3" aria-label="Zoom in">+</button>
        <button type="button" class="mini sq" data-a="zoom" data-v="0.77" aria-label="Zoom out">−</button>
        <button type="button" class="mini sq" data-a="fit" aria-label="Show the whole park">⤢</button>
      </div>
    </div>
    <section class="board" aria-label="Park board"><h2 class="cap" id="boardcap"></h2><div class="tilesg" id="board"></div></section>
    <section class="selp" id="selp" aria-label="Selection and commands"></section>
  </footer>
</div>
<div id="modal"></div>

function trackOf(ctrl, closed) { // Catmull-Rom through control points: a polyline with arc length, a Path2D and at(u) -> [x, y, angle]
  const c = closed ? ctrl.concat([ctrl[0]]) : ctrl, n = c.length, pts = [];
  const at0 = i => closed ? c[((i % (n - 1)) + n - 1) % (n - 1)] : c[Math.max(0, Math.min(n - 1, i))];
  for (let i = 0; i < n - 1; i++) {
    const p0 = at0(i - 1), p1 = c[i], p2 = c[i + 1], p3 = closed ? at0(i + 2) : at0(i + 2);

      pts.push([f(0), f(1)]);
    }
  }
  pts.push(c[n - 1].slice());
  const len = [0]; for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = len[len.length - 1], path = new Path2D(); pts.forEach((q, i) => i ? path.lineTo(q[0], q[1]) : path.moveTo(q[0], q[1]));
  const at = u => { const d = (((u % 1) + 1) % 1) * total; let i = 1; while (i < len.length - 1 && len[i] < d) i++; const a = pts[i - 1], b = pts[i], f = (d - len[i - 1]) / Math.max(1e-6, len[i] - len[i - 1]); return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.atan2(b[1] - a[1], b[0] - a[0])]; };
  return { pts, total, path, at };
}

   Speed (the phone budget in tests/browser/perf.js):
   - The ground (land, water, paths, trees, buildings, lamp posts) is painted once per zoom level into two world-sized
     layers, day and night, with the night lights baked in. Each frame blends them by the time of day; panning is free.
   - Each ride's art, shadow and lights are painted into a sprite, repainted only when the zoom, the dusk level or
     whether it is lit changes. Ride names are cached the same way.
   - Rings, badges, people and guests are drawn live every frame: they are the game state.
   Everything here is visual only and never touches the saved game. */
